name: Screenshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"

env:
  CARGO_TERM_COLOR: always

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            pkg-config \
            libx11-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            xvfb \
            imagemagick \
            libxkbcommon-x11-0 \
            libxcursor1 \
            libxrandr2 \
            ffmpeg \
            python3-xlib \
            python3-pil
      - name: Build
        run: cargo build --release
      - name: Run game and capture screenshot
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          sleep 2
          ./target/release/red-alert-rs &
          GAME_PID=$!
          sleep 5
          # Try ffmpeg first (better color fidelity)
          ffmpeg -f x11grab -video_size 1280x720 -i :99 -frames 1 /tmp/screenshot.png -y 2>&1 || true
          if [ ! -s /tmp/screenshot.png ]; then
            echo "ffmpeg failed, trying import"
            import -window root /tmp/screenshot.png
          fi
          ls -la /tmp/screenshot.png
          kill $GAME_PID 2>/dev/null || true
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: game-screenshot
          path: /tmp/screenshot.png